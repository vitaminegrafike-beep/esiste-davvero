<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080B0B">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <title>Proposta cursore · Esiste davvero?</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Proposta isolata: non tocca il gioco. Layout identico al round, cambia solo il controllo in basso. */
    .sw { display: flex; flex-direction: column; height: 100svh; max-width: 430px; margin: 0 auto; padding-top: env(safe-area-inset-top); }
    .sw .media { flex: 1 1 auto; min-height: 170px; height: auto; max-height: min(125vw, 537px); }
    .sw .media img { opacity: 1; }
    .sw .round__body { flex: 0 0 auto; padding-bottom: var(--s6); }
    .sw .round__info { gap: 0; }
    .sw .round__product { margin-top: var(--s2); }
    .sw [data-desc] { margin-top: var(--s4); }
    .sw [data-cat] { margin-top: var(--s6); }
    .sw .actions { position: static; background: none; }

    /* ---- Cursore a scorrimento ---- */
    .slide {
      --x: 0;              /* posizione del cursore da -1 (sinistra) a 1 (destra) */
      --knob: 52px;
      position: relative; height: 60px; border-radius: var(--r-pill);
      background: var(--surface-2); border: 1px solid var(--border-strong);
      overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
    }
    /* Riempimento che cresce dal centro verso il lato scelto */
    .slide__fill {
      position: absolute; top: 0; bottom: 0; left: 50%; width: 50%;
      background: linear-gradient(to right, rgba(151, 197, 158, 0.06), rgba(151, 197, 158, 0.38));
      transform-origin: left center; transform: scaleX(max(var(--x), 0));
    }
    .slide__fill--no {
      left: 0; transform-origin: right center; transform: scaleX(max(calc(var(--x) * -1), 0));
      background: linear-gradient(to left, rgba(199, 142, 120, 0.06), rgba(199, 142, 120, 0.38));
    }
    .slide__label {
      position: absolute; top: 0; bottom: 0; display: flex; align-items: center; gap: var(--s2);
      padding: 0 var(--s4) 0 18px; background: none; border: 0; color: var(--text); cursor: pointer;
      font: 600 13px/1 var(--sans); letter-spacing: 0.08em; text-transform: uppercase;
      transition: opacity var(--dur-press) var(--ease);
    }
    .slide__label svg { width: 16px; height: 16px; flex: none; opacity: 0.7; }
    .slide__label--no { left: 0; color: var(--wrong); opacity: calc(1 - max(var(--x), 0) * 1.4); }
    .slide__label--no svg { transform: scaleX(-1); }
    .slide__label--yes { right: 0; color: var(--correct); padding: 0 18px 0 var(--s4); opacity: calc(1 + min(var(--x), 0) * 1.4); }
    .slide__knob {
      position: absolute; top: 50%; left: 50%; width: var(--knob); height: var(--knob); margin: calc(var(--knob) / -2) 0 0 calc(var(--knob) / -2);
      border-radius: 50%; border: 0; color: var(--bg);
      background: var(--knob-bg, var(--text));
      display: grid; place-items: center; cursor: grab;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      transform: translateX(calc(var(--x) * var(--travel, 120px))) scale(var(--press, 1));
    }
    .slide__knob svg { width: 26px; height: 26px; }
    .slide.is-dragging .slide__knob { cursor: grabbing; --press: 1.06; }
    .slide.is-settling, .slide.is-settling * { transition: transform 360ms var(--ease), opacity 360ms var(--ease); }
    .slide.is-done { pointer-events: none; }
    .slide__hint { margin-top: var(--s3); text-align: center; }
    .slide__knob:focus-visible, .slide__label:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }

    /* Invito iniziale: il cursore oscilla una volta */
    @keyframes nudge { 0%, 100% { --x: 0; } 30% { --x: -0.22; } 65% { --x: 0.22; } }
    @property --x { syntax: "<number>"; inherits: true; initial-value: 0; }
    .slide.is-nudging { animation: nudge 1500ms var(--ease) 700ms both; }

    /* Esito sull'immagine (come nel gioco) */
    .verdict-pill { position: absolute; top: var(--s4); left: var(--gutter); display: inline-flex; align-items: center; gap: var(--s2);
      padding: 10px var(--s4) 10px 14px; border-radius: var(--r-pill); color: var(--bg);
      font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; line-height: 1;
      box-shadow: 0 4px 16px rgba(8, 11, 11, 0.35); animation: reveal-in var(--dur-reveal) var(--ease) both; }
    .verdict-pill .icon { width: 16px; height: 16px; }
    .media.is-correct .verdict-pill { background: var(--correct); }
    .media.is-wrong .verdict-pill { background: var(--wrong); }

    @media (prefers-reduced-motion: reduce) { .slide.is-nudging { animation: none; } }
  </style>
</head>
<body>
  <svg width="0" height="0" class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-logo" viewBox="0 0 40 24"><circle cx="12" cy="12" r="10.5" fill="none" stroke="currentColor" stroke-width="1.25"/><circle cx="28" cy="12" r="10.5" fill="none" stroke="currentColor" stroke-width="1.25"/></symbol>
    <symbol id="i-tick" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-miss" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8.5 12h7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15m-5-5 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-both" viewBox="0 0 24 24"><path d="m9 7-5 5 5 5M15 7l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <main class="sw">
    <header class="round__header">
      <div class="round__top"><span class="home" aria-hidden="true"><svg class="logo"><use href="#i-logo"/></svg></span><p class="t-meta" data-counter>Round 1 di 3</p></div>
      <div class="progress"><span class="progress__fill" data-progress></span></div>
    </header>

    <figure class="media" data-media>
      <img data-img src="" alt="" draggable="false">
    </figure>

    <div class="screen__body round__body" aria-live="polite">
      <div class="round__info" data-question>
        <h1 class="t-product" data-brand></h1>
        <p class="round__product" data-product></p>
        <p class="t-body muted" data-desc></p>
        <p class="t-meta accent" data-cat></p>
      </div>
      <div class="round__reveal" data-reveal hidden>
        <p class="verdict t-meta" data-verdict><svg class="icon" aria-hidden="true"><use data-verdict-icon href="#i-tick"/></svg><span data-verdict-text></span></p>
        <h1 class="t-h1" data-reveal-title></h1>
        <p class="t-body muted" data-reveal-text></p>
      </div>
    </div>

    <div class="actions">
      <div data-question-actions>
        <div class="slide is-nudging" data-slide role="group" aria-label="Questo prodotto esiste davvero?">
          <span class="slide__fill slide__fill--no" aria-hidden="true"></span>
          <span class="slide__fill" aria-hidden="true"></span>
          <button type="button" class="slide__label slide__label--no" data-answer="false">Non esiste</button>
          <button type="button" class="slide__label slide__label--yes" data-answer="true">Esiste</button>
          <button type="button" class="slide__knob" data-knob aria-label="Trascina a sinistra per Non esiste, a destra per Esiste. Con la tastiera usa le frecce."><svg aria-hidden="true"><use href="#i-both"/></svg></button>
        </div>
      </div>
      <button type="button" class="btn btn--primary" data-next hidden>Prossimo round <svg aria-hidden="true"><use href="#i-arrow"/></svg></button>
    </div>
  </main>

  <script>
  (function () {
    var ROUNDS = [
      { exists: false, brand: "MUGMOOD", product: "M1 Emotional Thermal Mug", desc: "Una tazza smart con display e-ink che cambia espressione in base alla temperatura della bevanda.", cat: "Smart Home / Lifestyle", img: "assets/images/01-mugmood-m1.webp", pos: "center 45%", alt: "Tazza smart in ceramica chiara con fascia display nera e volto digitale.", title: "MUGMOOD non esiste.", text: "Ce lo siamo inventato." },
      { exists: true, brand: "AMAGAMI HAM HAM", product: "Finger Nibbling Robot", desc: "Un robot-peluche progettato per mordicchiarti delicatamente il dito.", cat: "Robotics / Comfort Tech", img: "assets/images/02-amagami-ham-ham.webp", pos: "center 55%", alt: "Peluche a forma di gattino che mordicchia la punta di un dito.", title: "Esiste davvero.", text: "Lo produce Yukai Engineering. In vendita dal 2022." },
      { exists: false, brand: "ORVYN", product: "O1", desc: "Un orologio senza lancette, numeri o display che comunica l’ora attraverso sequenze di vibrazioni sul polso.", cat: "Haptic Watch / Digital Wellbeing", img: "assets/images/08-orvyn-o1.webp", pos: "center 45%", alt: "Orologio con quadrante nero completamente vuoto, senza lancette.", title: "ORVYN O1 non esiste.", text: "Ce lo siamo inventato. Un orologio pensato per percepire il tempo senza doverlo guardare." }
    ];
    var $ = function (s) { return document.querySelector(s); };
    var slide = $("[data-slide]"), knob = $("[data-knob]"), media = $("[data-media]"), img = $("[data-img]");
    var i = 0, locked = false, x = 0;
    var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

    function travel() { return (slide.clientWidth - 60) / 2; }   // corsa del cursore da centro a bordo
    function setX(v) {
      x = Math.max(-1, Math.min(1, v)); slide.style.setProperty("--x", x);
      // il cursore prende una leggera tinta del lato verso cui va
      var t = Math.min(1, Math.abs(x)) * 0.55, c = x >= 0 ? [151, 197, 158] : [199, 142, 120], b = [243, 239, 231];
      knob.style.setProperty("--knob-bg", "rgb(" + b.map(function (v, k) { return Math.round(v + (c[k] - v) * t); }).join(",") + ")");
    }
    function settle(fn) {
      slide.classList.add("is-settling");
      fn();
      setTimeout(function () { slide.classList.remove("is-settling"); }, reduce ? 0 : 360);
    }

    function render() {
      var r = ROUNDS[i];
      $("[data-counter]").textContent = "Round " + (i + 1) + " di " + ROUNDS.length;
      $("[data-progress]").style.width = ((i + 1) / ROUNDS.length * 100) + "%";
      img.src = r.img; img.alt = r.alt; img.style.objectPosition = r.pos;
      $("[data-brand]").textContent = r.brand; $("[data-product]").textContent = r.product;
      $("[data-desc]").textContent = r.desc; $("[data-cat]").textContent = r.cat;
      $("[data-question]").hidden = false; $("[data-reveal]").hidden = true;
      $("[data-question-actions]").hidden = false; $("[data-next]").hidden = true;
      media.classList.remove("is-correct", "is-wrong");
      var old = media.querySelector(".verdict-pill"); if (old) old.remove();
      slide.classList.remove("is-done"); setX(0); locked = false;
      slide.style.setProperty("--travel", travel() + "px");
    }

    function answer(value) {
      if (locked) return; locked = true;
      slide.classList.remove("is-nudging");
      settle(function () { setX(value ? 1 : -1); });
      slide.classList.add("is-done");
      var r = ROUNDS[i], correct = value === r.exists;
      if (navigator.vibrate) navigator.vibrate(correct ? 12 : [10, 40, 10]);
      setTimeout(function () {
        media.classList.add(correct ? "is-correct" : "is-wrong");
        var pill = document.createElement("span"); pill.className = "verdict-pill";
        pill.innerHTML = '<svg class="icon" aria-hidden="true"><use href="' + (correct ? "#i-tick" : "#i-miss") + '"/></svg>' + (r.exists ? "Esiste" : "Non esiste");
        media.appendChild(pill);
        var v = $("[data-verdict]"); v.className = "verdict t-meta " + (correct ? "is-correct" : "is-wrong");
        $("[data-verdict-icon]").setAttribute("href", correct ? "#i-tick" : "#i-miss");
        $("[data-verdict-text]").textContent = correct ? "Esatto." : "Non proprio.";
        $("[data-reveal-title]").textContent = r.title; $("[data-reveal-text]").textContent = r.text;
        $("[data-question]").hidden = true; $("[data-reveal]").hidden = false;
        $("[data-question-actions]").hidden = true; var nx = $("[data-next]"); nx.hidden = false;
        nx.firstChild.textContent = i === ROUNDS.length - 1 ? "Ricomincia " : "Prossimo round ";
      }, reduce ? 0 : 380);
    }

    // Trascinamento del cursore
    var startX = 0, startVal = 0, dragging = false, moved = false;
    knob.addEventListener("pointerdown", function (e) {
      if (locked) return;
      slide.classList.remove("is-nudging", "is-settling");
      slide.style.setProperty("--travel", travel() + "px");
      dragging = true; moved = false; startX = e.clientX; startVal = x;
      knob.setPointerCapture(e.pointerId); slide.classList.add("is-dragging");
    });
    knob.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      var d = e.clientX - startX; if (Math.abs(d) > 3) moved = true;
      setX(startVal + d / travel());
    });
    function release() {
      if (!dragging) return; dragging = false; slide.classList.remove("is-dragging");
      if (x > 0.7) { answer(true); return; }
      if (x < -0.7) { answer(false); return; }
      settle(function () { setX(0); });
    }
    knob.addEventListener("pointerup", release);
    knob.addEventListener("pointercancel", release);

    // Tastiera sul cursore: frecce
    knob.addEventListener("keydown", function (e) {
      if (e.key === "ArrowRight") { e.preventDefault(); answer(true); }
      if (e.key === "ArrowLeft") { e.preventDefault(); answer(false); }
    });

    document.addEventListener("click", function (e) {
      var b = e.target.closest("[data-answer]");
      if (b) { answer(b.getAttribute("data-answer") === "true"); return; }
      if (e.target.closest("[data-next]")) { i = (i + 1) % ROUNDS.length; render(); }
    });
    window.addEventListener("resize", function () { slide.style.setProperty("--travel", travel() + "px"); });

    render();
  })();
  </script>
</body>
</html>
